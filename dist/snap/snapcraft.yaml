name: glidekvm
base: core18
version: master
version-script: git describe --tags | sed "s/^v//"
adopt-info: glidekvm
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
icon: res/glidekvm.svg
license: GPL-2.0

apps:
  glidekvm:
    command: desktop-launch glidekvm #first run might take longer
    environment:
      # Fallback to XWayland if running in a Wayland session.
      DISABLE_WAYLAND: 1
    desktop: usr/share/applications/glidekvm.desktop
    common-id: io.github.bigoreo.glidekvm
    plugs: &plugs
      - desktop
      - desktop-legacy
      - home
      - joystick
      - network
      - opengl
      - pulseaudio
      - screen-inhibit-control
      - unity7
      - wayland
      - x11
  glidekvm-client:
    command: desktop-launch glidekvm-client
    plugs: *plugs
  glidekvm-server:
    command: desktop-launch glidekvm-server
    plugs: *plugs

parts:
  desktop-qt5:
    source: https://github.com/ubuntu/snapcraft-desktop-helpers.git
    source-subdir: qt
    plugin: make

  glidekvm:
    source: .
    source-type: git
    parse-info: [res/io.github.bigoreo.glidekvm.appdata.xml]
    plugin: cmake
    configflags:
      - "-DQT_DEFAULT_MAJOR_VERSION=5"
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DCMAKE_BUILD_TYPE=Release"
    build-packages:
      - build-essential
      - xorg-dev
      - libcurl4-openssl-dev
      - libavahi-compat-libdnssd-dev
      - libssl-dev
      - libx11-dev
      - qtbase5-dev
      - qt5-style-plugins
      - libxinerama-dev
      - libxrandr-dev
      - libxrender-dev
      - libxtst-dev
      - qtdeclarative5-dev
      - libavahi-common-dev
      - libqt5svg5-dev
    stage-packages:
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libqt5gui5
      - libqt5x11extras5
      - libqt5svg5
      - libxtst6
      - libavahi-client3
      - libavahi-common3
      - libavahi-compat-libdnssd1
    after: [desktop-qt5]

  fix-icon:
    plugin: nil
    override-build:
      sed -i 's|Icon=glidekvm|Icon=/usr/share/icons/hicolor/scalable/apps/glidekvm.svg|' $SNAPCRAFT_STAGE/usr/share/applications/glidekvm.desktop
    after: [glidekvm]

