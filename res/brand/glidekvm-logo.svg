<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" width="580" height="420">
  <title>GlideKVM</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="20" y1="40" x2="560" y2="400">
      <stop offset="0" stop-color="#3EEBE0"/>
      <stop offset="0.5" stop-color="#3B9BFF"/>
      <stop offset="1" stop-color="#8E5CF7"/>
    </linearGradient>

    <!-- the cable: tablet, under and up through the screen, over to the mouse -->
    <path id="cableA" d="M72 322C72 404 214 404 290 300C350 214 404 96 476 92C540 88 520 150 512 184"/>
    <!-- and back from the mouse, curving up into the cursor, which is its head -->
    <path id="cableB" d="M512 300C516 370 470 392 430 368C410 356 392.5 319 364.3 285.3"/>
    <!-- Bluetooth symbol, in front of its Wi-Fi waves -->
    <path id="rune" d="M278 74L318 110L298 128V46L318 64L278 100"/>
    <path id="arrow" d="M286.0 192.0L311.3 287.5L330.0 258.0L357.4 291.0L371.1 279.5L343.9 247.4L377.0 238.7Z"/>

    <!-- each device leaves a gap where the cable crosses it -->
    <mask id="monitorMask" maskUnits="userSpaceOnUse" x="0" y="0" width="580" height="420">
      <rect x="0" y="0" width="580" height="420" fill="#fff"/>
      <use href="#cableA" fill="none" stroke="#000" stroke-width="34"/>
      <use href="#cableB" fill="none" stroke="#000" stroke-width="34"/>
    </mask>
    <clipPath id="cableGap" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M0 0H580V420H0ZM291.0 182.2L288.4 181.3L285.6 181.0L282.8 181.5L280.3 182.6L278.1 184.4L276.4 186.6L275.4 189.2L275.0 192.0L275.4 194.8L300.7 290.3L301.7 292.9L303.4 295.2L305.7 296.9L308.2 298.1L311.0 298.5L313.8 298.2L316.5 297.2L318.8 295.6L320.6 293.4L331.2 276.7L348.9 298.0L351.1 300.0L353.6 301.3L356.4 302.0L359.3 301.8L362.0 301.0L364.5 299.4L378.2 287.9L380.1 285.8L381.4 283.2L382.1 280.4L381.9 277.6L381.1 274.8L379.5 272.4L363.6 253.6L379.8 249.3L382.5 248.2L384.8 246.4L386.6 244.1L387.7 241.3L388.0 238.4L387.5 235.5L386.3 232.8L384.4 230.6L382.0 228.9ZM455.0 258.0L455.5 265.3L456.9 272.5L459.3 279.4L462.5 286.0L466.6 292.1L471.4 297.6L476.9 302.4L483.0 306.5L489.6 309.7L496.5 312.1L503.7 313.5L511.0 314.0L518.3 313.5L525.5 312.1L532.4 309.7L539.0 306.5L545.1 302.4L550.6 297.6L555.4 292.1L559.5 286.0L562.7 279.4L565.1 272.5L566.5 265.3L567.0 258.0L567.0 226.0L566.5 218.7L565.1 211.5L562.7 204.6L559.5 198.0L555.4 191.9L550.6 186.4L545.1 181.6L539.0 177.5L532.4 174.3L525.5 171.9L518.3 170.5L511.0 170.0L503.7 170.5L496.5 171.9L489.6 174.3L483.0 177.5L476.9 181.6L471.4 186.4L466.6 191.9L462.5 198.0L459.3 204.6L456.9 211.5L455.5 218.7L455.0 226.0Z"/>
    </clipPath>
  </defs>

  <!-- tablet, with Wi-Fi above it -->
  <g fill="none" stroke="url(#g)" stroke-width="13" stroke-linejoin="round">
    <rect x="24.5" y="178.5" width="95" height="135" rx="11"/>
  </g>
  <path d="M24 290H120V306Q120 320 106 320H38Q24 320 24 306ZM66.5 305a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0-11 0Z" fill="url(#g)" fill-rule="evenodd"/>
  <g fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round">
    <path d="M22 116Q72 70 122 116"/>
    <path d="M44 138Q72 114 100 138"/>
    <path d="M62 158Q72 150 82 158"/>
  </g>

  <!-- monitor, with Bluetooth and its signal above it -->
  <g mask="url(#monitorMask)">
    <rect x="183" y="173" width="229" height="149" rx="10" fill="none" stroke="url(#g)" stroke-width="14"/>
    <path d="M282 329H314L320 352H276Z" fill="url(#g)"/>
    <rect x="246" y="350" width="104" height="16" rx="7" fill="url(#g)"/>
  </g>
  <g fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round">
    <path d="M232 64A78 78 0 0 1 364 64"/>
    <path d="M252 78A54 54 0 0 1 273 59"/>
    <path d="M335 66A54 54 0 0 1 344 78"/>
  </g>
  <use href="#rune" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mouse -->
  <rect x="471" y="186" width="80" height="112" rx="40" fill="none" stroke="url(#g)" stroke-width="12"/>
  <rect x="504" y="208" width="14" height="30" rx="7" fill="none" stroke="url(#g)" stroke-width="7"/>

  <!-- the glowing cable: a gradient tube with a bright core -->
  <!-- the cables stop just short of the mouse and the cursor, and the one
       from the tablet passes under the cursor with a gap all around it -->
  <g clip-path="url(#cableGap)" fill="none" stroke-linecap="round">
    <use href="#cableA" stroke="url(#g)" stroke-width="15"/>
    <use href="#cableB" stroke="url(#g)" stroke-width="15"/>
    <use href="#cableA" stroke="#E8FDFF" stroke-opacity="0.85" stroke-width="4.5"/>
    <use href="#cableB" stroke="#E8FDFF" stroke-opacity="0.85" stroke-width="4.5"/>
  </g>

  <!-- the cursor gliding across -->
  <use href="#arrow" fill="url(#g)"/>
</svg>
